# Everything tunable lives here (see CLAUDE.md §9).

robots: [wonik_allegro, wuji_hand, franka_emika_panda]   # selectable in the UI; hands do in-hand tasks
wuji_mjcf: assets/wuji-hand-description/mjcf/right.xml  # MIT, wuji-technology/wuji-hand-description (not committed)

models:
  # Confirm exact IDs at kickoff; only agents/gemini_client.py should read these.
  planner: gemini-4-neon
  planner_thinking: high
  critic: gemini-4-hydrogen
  fallback_planner: gemini-4-argon
  # Side quest: text prompt -> new object for the library (structured JSON output). Confirm IDs at kickoff.
  asset_generator: gemini-4-neon
  asset_generator_fallback: gemini-4-argon

render:
  preview_width: 480
  preview_height: 360
  thumb_size: 160
  # UI preview = side_cam + this angled free camera (sees the object under the hand and the fixture).
  overview:
    wonik_allegro:      { lookat: [0.0, -0.04, -0.07], distance: 0.55, azimuth: 240, elevation: -40 }
    wuji_hand:          { lookat: [0.0, -0.04, -0.07], distance: 0.55, azimuth: 240, elevation: -40 }
    franka_emika_panda: { lookat: [0.5, -0.04, 0.03], distance: 0.80, azimuth: 225, elevation: -38 }

# Simulator success thresholds (ground truth — never the critic's verdict). Used by sim/check.py
# and shown in the UI's success criteria.
layout:                          # "Shuffle layout" (seeded, reproducible); no seed = fixed default layout
  target_range_m: 0.08           # target object centre within +/- this of the workspace origin
  extras_range_m: 0.15           # other objects within +/- this (plus their own size, max ~3 cm more)
  shuffle_yaw: true              # also random yaw (never for articulated objects or 'turn part toward hand')
  max_redraws: 8                 # re-draw (same seed) if an object starts touching the robot

checks:
  lift_tolerance_cm: 1.5         # lifted >= target - tolerance
  held_min_height_cm: 2.0        # "still held" = in hand contact and at least this far above the table
  yaw_tolerance_deg: 15
  orientation_tolerance_deg: 20
  min_flip_deg: 150
  rest_tolerance_cm: 1.5         # "resting" = within this of the support surface
  max_lift_cm: 2.0               # push tasks: never lifted more than this (needs executor max_lift_cm)
  xy_tolerance_cm: 2.0
  min_tilt_deg: 65               # tip over
  max_tilt_deg: 115
  upright_tolerance_deg: 15      # stand upright
  facing_tolerance_deg: 25
  angle_tolerance_deg: 10        # articulated hinge
  key_depth_cm: 1.2              # key tip below the top of the lock cylinder
  hole_tolerance_cm: 0.6         # peg centre to hole centre
  peg_depth_cm: 1.5              # peg bottom below the board top
  button_press_fraction: 0.7     # of the button's travel
  bit_tolerance_cm: 0.8          # screwdriver bit tip to screw head
  drawer_min_open_cm: 4
  pour_fraction: 0.7             # beads in the bowl
  stack_tolerance_cm: 1.0        # tower / stack: height error per level
  clutter_disturb_cm: 3          # pick from clutter: max displacement of the other objects
